<!-- 
 event: Kejadian, apa yang terjadi
 onclick, onChange, onKeyup, onKeydown 
 -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom dan Event || Javascript</title>
  </head>
  <body>
    <!-- elementTarget.addEventListener() -->
    <h1>Form Sapaan</h1>
    <input type="text" id="nama" placeholder="Masukan Nama" />

    <button id="simpan">Klik Saya</button>
    <button id="hapus">Hapus</button>

    <p id="sapaan">Halo Nama :</p>
    <script>
      const heading = document.querySelector("h1");
      const nama = document.getElementById("nama");
      const sapaan = document.getElementById("sapaan");

      //   bisa dipakai berulang kali
      function prosesSapaan() {
        sapaan.innerText = `Halo nama : ${nama.value}`;
        nama.value = "";
      }
      document.getElementById("simpan").addEventListener("click", () => {
        // heading.innerText = "PPKD Jakarta Pusat";
        prosesSapaan();
      });

      nama.addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          prosesSapaan();
        }
      });

      document.getElementById("hapus").addEventListener("click", function () {
        heading.innerText = "";
      });
    </script>
  </body>
</html>
