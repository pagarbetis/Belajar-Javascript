<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom || Todo List</title>
  </head>
  <body>
    <h2>Daftar Rencana Kerja</h2>
    <input type="text" id="task" placeholder="Masukan tugas baru..." />

    <button id="tambah">tambah</button>

    <ul id="tasks"></ul>
    <script>
      // variabel
      const taskName = document.getElementById("task");
      const listTasks = document.getElementById("tasks");

      //   funtion membuat task
      function createTask() {
        const task = taskName.value;
        if (task === "") {
          alert("Task tidak boleh kosong");
          taskName.focus();
          return;
        }
        const li = document.createElement("li");
        li.innerText = task;
        li.innerHTML = `
            <span>${task}</span>
            <button class="btn-remove">Hapus</button>
        `;
        listTasks.appendChild(li);
        taskName.value = "";
      }

      // tambah task
      document.getElementById("tambah").addEventListener("click", function () {
        createTask();
      });

      //   EventListener
      taskName.addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          createTask();
        }
      });

      listTasks.addEventListener("click", function (event) {
        if (event.target.classList.contains("btn-remove")) {
          const li = event.target.parentElement;
          li.remove();
        }
      });
    </script>
  </body>
</html>
